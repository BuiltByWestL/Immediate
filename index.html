<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Immediate</title>
    <style>
      /* Critical pre-paint colors so the window never flashes white. Full tokens load with the app. */
      :root { color-scheme: light dark; --bg: #f5f5f4; --text: #161616; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1c; --text: #ededed; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
