<!doctype html>
<!--
  Font specimen: Immediate's bundled Inter tuning vs. Helvetica Neue.
  Open this file in a browser. Helvetica Neue is looked up from the fonts installed on
  this machine via local() — it is never copied into the repo or the app.
  Used to pick --opsz / --w-regular / --w-medium in src/design/tokens.css.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Font specimen</title>
<style>
  @font-face { font-family: "HN"; src: local("Helvetica Neue"), local("HelveticaNeue"), local("Helvetica Neue Roman"), local("HelveticaNeue-Roman"); font-weight: 400; }
  @font-face { font-family: "HN"; src: local("Helvetica Neue Medium"), local("HelveticaNeue-Medium"); font-weight: 500; }
  @font-face { font-family: "Inter"; src: url("../src/fonts/InterVariable-subset.woff2") format("woff2"); font-weight: 100 900; }
  body { margin: 0; padding: 20px 28px; background: #f5f5f4; color: #161616; -webkit-font-smoothing: antialiased; font-family: system-ui, sans-serif; }
  h2 { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #8a8a86; margin: 18px 0 6px; }
  .row { display: grid; grid-template-columns: 190px 1fr; align-items: baseline; padding: 4px 0; border-top: 1px solid rgba(128,128,128,.25); }
  .label { font: 11px/1.3 system-ui, sans-serif; color: #8a8a86; }
  .s { white-space: nowrap; }
  .inter { font-family: "Inter"; font-feature-settings: "cv10" 1, "ss03" 1; }
  .hn { font-family: "HN"; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .panel { padding: 0 14px 10px; border-radius: 6px; }
  .dark { background: #1b1b1c; color: #ededed; }
</style>
</head>
<body>
<div class="pair">
  <div class="panel" id="light"></div>
  <div class="panel dark" id="dark"></div>
</div>
<script>
  // [label, family class, opsz, roman wght, medium wght]
  // "Shipped" must match src/design/tokens.css.
  const variants = [
    ["Helvetica Neue (local)", "hn", null, 400, 500],
    ["Shipped: opsz 28 · 420/570", "inter", 28, 420, 570],
    ["Inter default · 400/500", "inter", 14, 400, 500],
    ["opsz 32 · 430/590", "inter", 32, 430, 590],
  ];
  const sections = [
    ["13 px Roman", 13, false, "Drop a file here, or click to open · Save a Copy"],
    ["13 px Medium", 13, true, "Exposure  Highlights  Shadows  1:23.45  −12 dB"],
    ["12 px Roman", 12, false, "Keyframe-snapped · 8.2 Mb/s · H.264 High · MP4"],
    ["17 px Medium", 17, true, "AaGgRrQq ft “Quotes”, 1234567890"],
    ["24 px Medium", 24, true, "Immediate  Grab 2:41"],
  ];
  for (const id of ["light", "dark"]) {
    const root = document.getElementById(id);
    for (const [title, px, med, text] of sections) {
      const h = document.createElement("h2"); h.textContent = title; root.append(h);
      for (const [name, cls, opsz, r, m] of variants) {
        const row = document.createElement("div"); row.className = "row";
        const label = document.createElement("div"); label.className = "label"; label.textContent = name;
        const s = document.createElement("div");
        s.className = "s " + cls;
        s.style.fontSize = px + "px";
        s.style.fontWeight = med ? m : r;
        if (opsz) s.style.fontVariationSettings = `"opsz" ${opsz}`;
        s.textContent = text;
        row.append(label, s); root.append(row);
      }
    }
  }
</script>
</body>
</html>
