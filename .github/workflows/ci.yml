# Checks and test builds on every push to main, on Linux, Windows and macOS (Actions minutes
# are free for a public repository). Release builds with updater signatures live in release.yml.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check the UI
        run: npm run check
      - name: Theme contrast
        run: npm run test:themes
      - name: Photo pipeline golden images (preview = saved; no drift)
        run: npm run test:golden
      - name: File associations are up to date with src/formats.json
        run: node scripts/gen-associations.mjs --check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/shell-ext

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libasound2-dev
          # ffmpeg: the live-preview-vs-saved-sound test filters real audio with it.
          sudo apt-get install -y ffmpeg

      - run: npm ci
      - name: Build the UI (the Rust build embeds it)
        run: npm run build
      - name: Build the right-click entry (Windows; bundled files must exist before Rust builds)
        if: runner.os == 'Windows'
        run: node scripts/build-shell-menu.mjs
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Right-click entry tests (Windows)
        if: runner.os == 'Windows'
        run: cargo test --release --manifest-path src-tauri/shell-ext/Cargo.toml

      - name: Build the app
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS)   bundles=app ;;
            Linux)   bundles=deb ;;
          esac
          # CI builds aren't release builds: no updater signature, and the Windows right-click
          # package stays unsigned (release.yml signs both).
          npx tauri build --bundles "$bundles" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Installer size budget (12 MB)
        if: runner.os == 'Windows'
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          size=$(stat -c %s "$f")
          echo "$(basename "$f"): $((size / 1024)) KB"
          test "$size" -le $((12 * 1024 * 1024))

      - name: Startup budget (informational on shared runners)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node scripts/bench-startup.mjs 5

      - uses: actions/upload-artifact@v7
        with:
          name: immediate-${{ runner.os }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/macos/*.app
