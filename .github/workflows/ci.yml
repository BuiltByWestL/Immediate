# Checks and test builds on every push to main.
#
# Minutes: the repo is private, so GitHub's free 2,000 minutes/month apply, and macOS minutes
# count 10x (Windows 2x). Pushes therefore build Linux + Windows only (~35 counted minutes);
# macOS builds run when started by hand (Actions > CI > Run workflow) or for a version tag.
# Release builds with updater signatures live in release.yml (P5).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build on macOS (counts 10x against free minutes)"
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check the UI
        run: npm run check
      - name: Theme contrast
        run: npm run test:themes
      - name: File associations are up to date with src/formats.json
        run: node scripts/gen-associations.mjs --check

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.macos)) && '["ubuntu-22.04","windows-latest","macos-latest"]' || '["ubuntu-22.04","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev

      - run: npm ci
      - name: Build the UI (the Rust build embeds it)
        run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build the app
        run: |
          case "$RUNNER_OS" in
            Windows) bundles=nsis ;;
            macOS)   bundles=app ;;
            Linux)   bundles=deb ;;
          esac
          # CI builds aren't release builds: no updater signature (the key stays off CI until P5).
          npx tauri build --bundles "$bundles" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Installer size budget (12 MB)
        if: runner.os == 'Windows'
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          size=$(stat -c %s "$f")
          echo "$(basename "$f"): $((size / 1024)) KB"
          test "$size" -le $((12 * 1024 * 1024))

      - name: Startup budget (informational on shared runners)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node scripts/bench-startup.mjs 5

      - uses: actions/upload-artifact@v7
        with:
          name: immediate-${{ runner.os }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/macos/*.app
